<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身体成分设置 · 需求评审</title><style>*{box-sizing:border-box}body{margin:0;font-family:Microsoft YaHei,sans-serif;color:#25324a;background:#f3f5f9}header{height:68px;background:white;border-bottom:1px solid #e0e5ed;padding:20px 28px;font-size:20px;font-weight:bold}header small{font-size:13px;font-weight:normal;color:#798397;margin-left:20px}.layout{display:grid;grid-template-columns:220px minmax(460px,1fr) 430px;height:calc(100vh - 68px)}nav,aside{background:white;overflow:auto;padding:24px}nav{border-right:1px solid #e0e5ed}nav h3{font-size:14px;color:#7a8798;margin-top:0}nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:16px 12px;border-radius:8px;margin:6px 0;color:#42516a;font-size:15px;cursor:pointer}nav button.active{background:#edf3ff;color:#2162e8;font-weight:bold}.center{padding:18px;overflow:hidden;display:flex;justify-content:center;background:#e7ebf1}iframe{width:100%;max-width:680px;height:100%;border:0;border-radius:14px;box-shadow:0 6px 28px #26395722;background:#202934}aside{border-left:1px solid #e0e5ed}aside h2{font-size:21px;margin:0 0 22px}aside h3{font-size:15px;margin:24px 0 10px}aside p{font-size:14px;line-height:1.9;color:#536078;margin:0}aside .tag{font-size:12px;color:#2563eb;margin-bottom:14px}.note{font-size:12px;line-height:1.8;color:#8a94a4;margin-top:28px}@media(max-width:1150px){.layout{grid-template-columns:170px minmax(360px,1fr) 340px}nav,aside{padding:16px}}@media(max-width:850px){.layout{grid-template-columns:140px 1fr;height:auto}.center{height:90vh}aside{grid-column:1/-1}}aside{padding:24px 26px}aside h2{line-height:1.5}aside h3{font-size:16px;margin:0 0 16px;color:#1e3457}.requirement-section{padding:22px 0;border-top:1px solid #e8edf4}aside ol{padding-left:24px;margin:12px 0 0}aside li{font-size:14px;color:#46556b;line-height:1.9;padding-left:4px;margin-bottom:12px}aside li::marker{font-weight:600;color:#526886}.table-wrap{overflow-x:auto;margin:10px 0 18px}aside table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.7}aside th,aside td{border:1px solid #dde5ef;padding:10px 9px;text-align:left;vertical-align:top;min-width:60px;overflow-wrap:anywhere}aside th{background:#f0f5fc;color:#304766;font-weight:600}aside tbody tr:nth-child(even){background:#fafbfd}.layout{grid-template-columns:210px minmax(420px,1fr) minmax(450px,35vw)}@media(max-width:1150px){.layout{grid-template-columns:160px minmax(340px,1fr) 380px}}@media(max-width:850px){.layout{grid-template-columns:140px 1fr}aside{grid-column:1/-1}}</style><header>身体成分设置 <small>交互演示与需求说明</small></header><div class="layout"><nav><h3>修改项</h3><button data-page="settings">设置首页</button><button data-page="body">身体成分设置</button><button data-page="source">腰臀比数据来源</button><button data-page="bmi">BMI参考标准</button><p class="note">点击左侧修改项或中间页面，右侧说明同步切换。当前演示海外适配设备，配置仅保存在浏览器。</p></nav><section class="center"><iframe title="设备端交互演示" src="身体成分设置-交互页.html"></iframe></section><aside id="requirements"></aside></div><script>const docs={"settings": {"title": "设置首页", "sections": [{"title": "1. 菜单入口", "items": ["在「体重测量」下方新增「身体成分设置」菜单，点击进入对应页面。", "菜单样式与设备当前设置页面保持统一。"], "headers": [], "rows": []}]}, "body": {"title": "身体成分设置", "sections": [{"title": "1. 腰臀比数据来源", "items": ["说明文案为「设置报告中腰臀比的数据来源」。", "入口摘要显示已保存的「体成分输出」或「体围输出」。", "适用于同时支持体成分、体围测量且已适配本功能的设备。"], "headers": [], "rows": []}, {"title": "2. BMI参考标准", "items": ["说明文案为「设置BMI正常范围与标准值」。", "仅适用于已适配本功能的海外设备。", "四项已保存值均等于默认值时显示「默认」，否则显示「自定义」。"], "headers": [], "rows": []}]}, "source": {"title": "腰臀比数据来源配置", "sections": [{"title": "1. 功能范围", "items": ["将原CMDB平台的腰臀比数据来源配置下放至设备端，由用户自行选择。", "适用于同时支持体成分、体围测量且已适配本功能的设备。", "配置按设备保存，入口摘要显示已保存的「体成分输出」或「体围输出」。"], "headers": [], "rows": []}, {"title": "2. 页面内容", "items": ["选项下方提示「选择后自动保存，从下次测量开始生效。」"], "headers": ["单选项", "说明文案"], "rows": [["体成分输出", "使用体成分测量结果计算腰臀比"], ["体围输出", "使用体围测量结果计算腰臀比，无有效体围数据时不展示。"]]}, {"title": "3. 选择及保存", "items": ["两项单选，整张卡片可点击。选中效果与设备当前样式保持统一。", "点击另一选项后自动保存，成功后更新选中状态及入口摘要，提示「已切换，下次测量生效」。", "点击当前选中项不重复保存，保存过程中禁止重复提交。", "保存失败时保留原选中项，提示「切换失败，请重试」。"], "headers": [], "rows": []}, {"title": "4. 出厂默认及CMDB配置关联", "items": ["新出厂设备默认配置为「体围输出」。", "存量设备升级至支持本功能的版本后，首次启动应用时，将已有有效CMDB配置写入设备端。确认无既有配置时，使用「体围输出」；读取失败时提示重试。", "初始配置成功保存后，后续启动使用设备端已保存配置，CMDB中的对应配置项改为只读。用户在设备端修改成功后，同步至CMDB展示。", "同步失败时保留设备端已保存配置，后续重试同步。报告按本次测量记录携带的来源进行处理。", "已保存初始配置后，延迟返回的旧CMDB配置不得覆盖设备端配置。", "未升级至支持本功能版本的设备，继续通过原CMDB方式配置。"], "headers": [], "rows": []}, {"title": "5. 数据及报告展示规则", "items": ["选择体成分输出时，腰臀比仅在肥胖分析模块展示；选择体围输出时，仅在体围测量模块展示。", "体成分结果缺失或无效时，隐藏腰臀比字段。", "体围来源使用统一单位的原始有效腰围、臀围计算，按报告统一精度展示。未测体围、测量失败、任一数据缺失、无效或≤0时，隐藏腰臀比字段。", "所选来源无有效结果时，不自动切换另一来源，不使用其他测量记录或历史数据补充。", "无同来源的有效历史值时，「与上次对比」显示「—」，避免将不同来源的结果直接比较。"], "headers": ["所选来源", "数据规则", "报告展示位置"], "rows": [["体成分输出", "使用本次体成分测量对应的有效腰臀比结果", "肥胖分析模块"], ["体围输出", "使用本次同一测量记录的有效腰围÷有效臀围", "体围测量模块"]]}, {"title": "6. 配置生效及多端展示", "items": ["配置保存成功后无需重启，从下一次测量开始生效。", "本次测量使用的来源随测量记录保存，同步至各相关端，确保同一测量记录的腰臀比来源、数值及展示状态在多端呈现一致。", "历史报告沿用原测量来源及结果。旧记录按原规则兼容，后续修改设备端或CMDB配置不改变历史报告。", "新增文案覆盖设备端当前支持的语言，确保无文案截断、遮挡或操作异常。"], "headers": [], "rows": []}]}, "bmi": {"title": "BMI参考标准配置", "sections": [{"title": "1. 功能范围", "items": ["仅适用于已适配本功能的海外设备。", "配置按设备保存。四项已保存值均等于默认值时，入口摘要显示「默认」，否则显示「自定义」。"], "headers": [], "rows": []}, {"title": "2. 页面内容", "items": ["输入框占位提示统一为「请输入」。", "正常范围下方始终展示范围表达式，例如「18.5 ≤ BMI ≤ 24.9」，上下限均包含等于。", "分组下方放置「恢复默认」，页面底部放置「保存」。", "保存按钮上方提示「保存后，从下次测量开始生效。」"], "headers": ["分组", "输入项", "默认值"], "rows": [["正常范围", "下限", "18.5"], ["正常范围", "上限", "24.9"], ["标准值", "男性", "22.0"], ["标准值", "女性", "21.5"]]}, {"title": "3. 输入及校验", "items": ["仅允许输入数字和一个小数点，最多一位小数，禁止输入空格及其他字符。", "用户离开当前输入框时立即校验，点击保存时再次校验全部四项。", "错误提示展示在对应输入框下方，输入框标记异常边框。修改正确后清除提示，已出现的关联错误同步更新。", "同一字段存在多个错误时，依次优先提示必填、格式、数值关系错误。"], "headers": ["输入项", "校验规则", "提示文案"], "rows": [["全部输入项", "不能为空", "请输入数值"], ["全部输入项", "有效正数，最多一位小数", "请输入有效正数，最多保留一位小数"], ["下限", "下限＜上限", "下限须小于上限"], ["上限", "上限＞下限", "上限须大于下限"], ["男性标准值", "下限≤男性标准值≤上限", "男性标准值须位于正常范围内"], ["女性标准值", "下限≤女性标准值≤上限", "女性标准值须位于正常范围内"]]}, {"title": "4. BMI范围展示", "items": ["表达式随上下限编辑实时更新，始终可见。", "某项为空或格式无效时，该项显示「—」，例如「18.5 ≤ BMI ≤ —」。", "下限≥上限时保留输入值，表达式使用异常颜色，并在对应输入框下方提示错误。", "表达式展示当前编辑内容，保存成功后才用于后续测量。"], "headers": [], "rows": []}, {"title": "5. 保存、返回及恢复默认", "items": ["有实际数值变化时启用「保存」，仅数值格式变化不视为修改。", "四项校验通过后整体保存，保存过程中禁止重复提交。", "成功后保留当前页，统一回显一位小数，更新入口摘要，保存按钮置灰，提示「已保存，下次测量生效」。", "失败时保留编辑内容，原配置继续生效，提示「保存失败，请重试」。", "有未保存修改时返回，弹出「是否保存修改？」确认弹窗，底部提供「放弃修改」「保存」，右上角提供关闭「×」。", "点击「放弃修改」后返回上级页面；点击「保存」且成功后返回，失败时停留配置页；点击「×」关闭弹窗，保留当前编辑内容。", "点击「恢复默认」将四项填为默认值，清除错误并更新范围表达式，点击保存后生效。", "当前编辑值全部等于默认值时，「恢复默认」置灰。"], "headers": [], "rows": []}, {"title": "6. 配置生效及数据规则", "items": ["配置保存成功后无需重启，从下一次测量开始生效。", "本次测量使用的四项参数随测量记录保存，同步至各端展示，确保同一测量记录在多端呈现的BMI等级一致。", "历史报告沿用原测量配置及结果，旧记录按旧版本规则兼容。", "首次使用或配置读取失败时，使用出厂默认值进行相关结果计算。"], "headers": [], "rows": []}]}};const frame=document.querySelector('iframe');function render(page){if(!docs[page])return;document.querySelectorAll('nav button').forEach(button=>button.classList.toggle('active',button.dataset.page===page));const target=document.getElementById('requirements');target.replaceChildren();const tag=document.createElement('div');tag.className='tag';tag.textContent='对应页面需求说明';target.append(tag);const title=document.createElement('h2');title.textContent=docs[page].title;target.append(title);docs[page].sections.forEach(section=>{const group=document.createElement('section');group.className='requirement-section';const h=document.createElement('h3');h.textContent=section.title;group.append(h);if(section.headers.length){const wrap=document.createElement('div');wrap.className='table-wrap';const table=document.createElement('table');const head=document.createElement('thead');const row=document.createElement('tr');section.headers.forEach(value=>{const cell=document.createElement('th');cell.textContent=value;row.append(cell)});head.append(row);table.append(head);const body=document.createElement('tbody');section.rows.forEach(values=>{const tr=document.createElement('tr');values.forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td)});body.append(tr)});table.append(body);wrap.append(table);group.append(wrap)}if(section.items.length){const list=document.createElement('ol');section.items.forEach(text=>{const item=document.createElement('li');item.textContent=text;list.append(item)});group.append(list)}target.append(group)});target.scrollTop=0}window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data.type==='demo-page')render(event.data.page)});document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>frame.contentWindow.postMessage({type:'navigate',page:button.dataset.page},'*'));render('settings');</script></html>
